<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0f172a">
  <title>لا يوجد اتصال بالإنترنت | رؤية العقارية</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a 85%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px -10px rgba(245, 158, 11, 0.15);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .icon-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.05));
      border: 1px solid rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f59e0b;
    }
    .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 28px;
      border: 2px dashed rgba(245, 158, 11, 0.4);
      animation: spin 20s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .brand-name {
      font-size: 13px;
      font-weight: 700;
      color: #f59e0b;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.3);
      transition: all 0.2s ease;
    }
    .retry-btn:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      transform: translateY(-2px);
      box-shadow: 0 14px 24px -5px rgba(245, 158, 11, 0.4);
    }
    .retry-btn:active {
      transform: translateY(0);
    }
    .retry-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.4s ease;
    }
    .retry-btn:hover svg {
      transform: rotate(180deg);
    }
    .status-hint {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ef4444;
      animation: blink 2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <div class="pulse-ring"></div>
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <div class="brand-name">رؤية العقارية</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل بالشبكة حالياً. يرجى التحقق من اتصال الواي فاي أو باقة البيانات في جهازك ثم المحاولة مرة أخرى.</p>

    <button class="retry-btn" onclick="retryConnection()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
        <path d="M16 21h5v-5"></path>
      </svg>
      <span>إعادة المحاولة</span>
    </button>

    <div class="status-hint">
      <span class="dot"></span>
      <span>في انتظار استعادة الاتصال تلقائياً...</span>
    </div>
  </div>

  <script>
    function retryConnection() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.retry-btn span');
        const oldText = btn.textContent;
        btn.textContent = 'جاري التحقق...';
        setTimeout(() => {
          btn.textContent = oldText;
          if (navigator.onLine) {
            window.location.reload();
          }
        }, 1200);
      }
    }

    // Auto reload as soon as network is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
